<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title description">
  <title id="title">Зеркало — фитнес-тренер, который видит технику</title>
  <desc id="description">Тёмный баннер с бирюзовой схемой распознавания позы, счётчиком повторений и подписью Web и Android.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#101f31"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#257e80" stop-opacity=".28"/><stop offset="1" stop-color="#257e80" stop-opacity="0"/></radialGradient>
    <linearGradient id="mint" x2="1" y2="1"><stop stop-color="#96ffe0"/><stop offset="1" stop-color="#5cd6ee"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6bbeb8" stroke-opacity=".06"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="edge" x2="1"><stop stop-color="#88efd3"/><stop offset="1" stop-color="#88efd3" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="640" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="640" rx="24" fill="url(#grid)"/>
  <ellipse cx="1220" cy="300" rx="570" ry="420" fill="url(#glow)"/>
  <g font-family="Inter, DejaVu Sans, sans-serif">
    <g transform="translate(78 64)">
      <rect width="40" height="40" rx="12" fill="#173b41" stroke="#76e5ce" stroke-opacity=".45"/>
      <path d="M12 11H7v18h5M28 11h5v18h-5M20 11v18" fill="none" stroke="#96f7df" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="26" fill="#b5cbda" font-size="15" font-weight="600" letter-spacing="3">ДВИЖЕНИЕ. ТЕХНИКА. ПРОГРЕСС.</text>
    </g>
    <text x="73" y="238" fill="#f1f7fc" font-size="111" font-weight="800" letter-spacing="-7">ЗЕРКАЛО</text>
    <rect x="79" y="270" width="106" height="5" rx="2.5" fill="url(#mint)"/>
    <text x="77" y="339" fill="#edf5fc" font-size="34" font-weight="500">Фитнес-тренер,</text>
    <text x="77" y="388" fill="#edf5fc" font-size="34" font-weight="500">который видит технику.</text>
    <text x="79" y="445" fill="#abc1d2" font-size="20">Камера видит движение — ты видишь прогресс.</text>
    <g transform="translate(78 525)" font-size="14" font-weight="600">
      <rect width="181" height="42" rx="21" fill="#173331" stroke="#32625a"/><text x="24" y="27" fill="#b2f8df">11 упражнений</text>
      <rect x="193" width="185" height="42" rx="21" fill="#152639" stroke="#34495f"/><text x="216" y="27" fill="#d9e9f6">Web + Android</text>
      <rect x="390" width="194" height="42" rx="21" fill="#152639" stroke="#34495f"/><text x="413" y="27" fill="#d9e9f6">Без отправки видео</text>
    </g>
    <g transform="translate(870 57)">
      <rect width="652" height="526" rx="30" fill="#0c1927" fill-opacity=".7" stroke="#3b6871" stroke-opacity=".75"/>
      <path d="M26 73H626M26 454H626" stroke="#284552"/>
      <circle cx="35" cy="37" r="5" fill="#8defd0"/>
      <text x="51" y="43" fill="#b4efd9" font-size="12" font-weight="600" letter-spacing="1.8">ПОЗА НАЙДЕНА</text>
      <text x="617" y="43" fill="#829fb3" font-size="12" text-anchor="end" letter-spacing="1.4">POSE / 01</text>
      <path d="M103 126V101H129 M439 101H465V126 M103 393V418H129 M439 418H465V393" fill="none" stroke="#5ca49e" stroke-width="2"/>
