        <path d="M297 207L262 291L347 316L317 399M297 207L350 245L405 233" stroke="#5b8497" stroke-width="15"/>
        <path d="M272 201L237 284L326 307L293 399M272 201L328 240L385 228" stroke="#7feacf" stroke-opacity=".2" stroke-width="27" filter="url(#soft)"/>
        <path d="M272 201L237 284L326 307L293 399M272 201L328 240L385 228" stroke="url(#mint)" stroke-width="15"/>
        <path d="M272 201L297 207M237 284L262 291M293 399L326 402M317 399L349 402" stroke="#8fe6d4" stroke-width="10"/>
        <path d="M282 178L272 201" stroke="#bcecdf" stroke-width="11"/>
        <circle cx="287" cy="151" r="27" stroke="#d4fff0" stroke-width="7"/>
        <path d="M287 146L303 152" stroke="#d4fff0" stroke-width="3"/>
        <path d="M303 301Q294 319 309 332" stroke="#efffea" stroke-width="2"/>
      </g>
      <g fill="#112f3b" stroke="#b0ffe7" stroke-width="3">
        <circle cx="272" cy="201" r="6"/><circle cx="328" cy="240" r="6"/>
        <circle cx="385" cy="228" r="6"/><circle cx="237" cy="284" r="6"/>
        <circle cx="326" cy="307" r="6"/><circle cx="293" cy="399" r="6"/>
      </g>
      <path d="M338 307H422L447 288" fill="none" stroke="#559b98" stroke-width="1.5"/>
      <rect x="447" y="259" width="160" height="61" rx="13" fill="#173635" stroke="#3d756b"/>
      <text x="462" y="283" fill="#a0cfc1" font-size="10" font-weight="600" letter-spacing="1">УГОЛ КОЛЕНА</text>
      <text x="462" y="307" fill="#b2ffe2" font-size="23" font-weight="600">92°</text>
      <g transform="translate(449 99)">
        <rect width="158" height="134" rx="18" fill="#142638" stroke="#36576b"/>
        <text x="20" y="28" fill="#aac2d6" font-size="11" letter-spacing="1">ПОВТОРЕНИЯ</text>
        <text x="16" y="91" fill="#f0faff" font-size="62" font-weight="800" letter-spacing="-4">08</text>
        <text x="22" y="114" fill="#85e4c7" font-size="11">из 12</text>
        <rect x="64" y="107" width="73" height="4" rx="2" fill="#2a4354"/>
        <rect x="64" y="107" width="49" height="4" rx="2" fill="#80e6c5"/>
      </g>
      <text x="29" y="488" fill="#8aabbf" font-size="11" letter-spacing="1.6">MEDIAPIPE</text>
      <path d="M193 486H218L226 477L235 496L246 474L256 487H363" stroke="#75d8bd" stroke-width="1.5" fill="none"/>
      <text x="617" y="490" text-anchor="end" fill="#c3d7e7" font-size="13">Техника в фокусе</text>
    </g>
  </g>
