<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <title>Зеркало — фитнес-тренер, который видит технику</title>
    <meta
      name="description"
      content="Веб-тренер на камере: считает повторения, замечает ошибки техники и подсказывает, что поправить. Старт и пауза — двумя жестами, выбор упражнений — касанием."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%97%89%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="stage stage--mirrored" id="stage">
      <video id="video" class="stage__video" playsinline muted autoplay></video>
      <canvas id="skeleton" class="stage__canvas"></canvas>
      <canvas id="effects" class="stage__canvas"></canvas>
      <div class="stage__vignette"></div>
      <div class="ui" id="ui"></div>
      <div class="fps" id="fps"></div>
    </div>
    <noscript>
      Для работы приложения нужен включённый JavaScript: распознавание позы выполняется в браузере.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
